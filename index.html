<!doctype html>
<html lang="ru" data-stub>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Площадка продажи красивых автономеров · демо готовится</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="120">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;600&display=swap">
<style>
:root{--bg:#F6F3EE;--ink:#1F1E1C;--muted:#6B655C;--acc:#8A6737}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--ink:#EDE7DC;--muted:#A9A195;--acc:#C9A66B}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{max-width:560px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.k{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font:500 clamp(2rem,6vw,3rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.bar{width:220px;height:3px;background:color-mix(in srgb,var(--acc) 20%,transparent);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--acc);animation:m 1.6s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:60%}}
</style>
</head>
<body><main>
<div class="k">Демо-версия по вашему ТЗ</div>
<h1>Площадка продажи красивых автономеров</h1>
<div class="bar" aria-hidden="true"><i></i></div>
<p>Сайт сейчас собирается по вашему техническому заданию.<br>Будет готов сегодня к <b>17:20</b> – по этой же ссылке.</p>
<p style="font-size:.85rem">Страница обновится сама.</p>
</main></body></html>
